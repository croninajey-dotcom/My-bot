services:
  - type: web
    name: mya-telegram-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: OWNER_ID
        sync: false
      - key: CHANNEL_LINK
        sync: false
      - key: BOT_LINK
        sync: false
      - key: PORT
        value: 10000
